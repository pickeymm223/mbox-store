# Cloud Build for MBOX Store — builds a debug APK on every push to main
# and publishes it as a GitHub Release asset (mbox-store-v<versionCode>.apk).
name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Android SDK API 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || echo "sdkmanager install skipped (already present)"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
          arguments: assembleDebug

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VC=$(grep -m1 'versionCode' app/build.gradle | grep -o '[0-9]*')
          TAG="build-v${VC}"
          cp app/build/outputs/apk/debug/app-debug.apk "mbox-store-v${VC}.apk"
          gh release create "$TAG" "mbox-store-v${VC}.apk" \
            --title "MBOX Store build v${VC}" \
            --notes "Automated CI build of MBOX Store (debug-signed for testing)." \
          || gh release upload "$TAG" "mbox-store-v${VC}.apk" --clobber

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
